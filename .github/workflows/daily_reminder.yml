name: Daily Task Reminder

on:
  schedule:
    # רץ כל יום בשעה 06:00 בבוקר (זמן UTC, שזה בערך 08:00 או 09:00 בישראל)
    - cron: '0 6 * * *'
  workflow_dispatch: # מאפשר לך להריץ את זה ידנית לבדיקה

jobs:
  send_reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Send Telegram Notification
        run: |
          TASKS=$(cat tasks.json | jq -r '.[] | "- \(.user): \(.title)"')
          MESSAGE="בוקר טוב! 🏠%0Aאלו המטלות להיום:%0A$TASKS"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE"
