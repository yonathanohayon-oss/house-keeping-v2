<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליגת המטלות - יוני ואינה</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #6366f1; --ina: #ec4899; --yoni: #0ea5e9; }
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; padding-bottom: 120px; }
        .app-container { max-width: 500px; margin: 20px auto; background: white; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); overflow: hidden; }
        .header { background: linear-gradient(135deg, var(--primary), #4338ca); color: white; padding: 25px; text-align: center; }
        .score-board { display: flex; justify-content: space-around; background: rgba(255,255,255,0.15); margin-top: 15px; padding: 15px; border-radius: 20px; }
        .task-card { background: #fff; border: 1px solid #f1f5f9; border-radius: 20px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; transition: all 0.2s; }
        .task-card.done { background-color: #f1f5f9; opacity: 0.8; }
        .user-assigned { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-left: 12px; font-size: 0.9rem; }
        .badge-yoni { background: var(--yoni); }
        .badge-ina { background: var(--ina); }
        .badge-none { background: #e2e8f0; color: #94a3b8; }
        .task-info { flex-grow: 1; cursor: pointer; }
        .task-points { font-size: 0.75rem; color: var(--primary); font-weight: bold; background: #eef2ff; padding: 2px 8px; border-radius: 8px; margin-right: 5px; }
        .input-section { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: white; padding: 20px; border-top: 1px solid #f1f5f9; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h3 class="mb-0">מי לוקח את המשימה? 🏆</h3>
        <div class="score-board">
            <div><small>יוני</small><br><strong id="scoreYoni" style="font-size: 1.5rem;">0</strong></div>
            <div style="border-left: 1px solid rgba(255,255,255,0.3);"></div>
            <div><small>אינה</small><br><strong id="scoreIna" style="font-size: 1.5rem;">0</strong></div>
        </div>
    </div>

    <div class="content p-3">
        <div id="taskList">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
        <div id="status" class="text-center small text-muted mt-2"></div>
    </div>

    <div class="input-section">
        <div class="input-group mb-2">
            <input type="text" id="taskInput" class="form-control rounded-start-pill" placeholder="משימה חדשה...">
            <input type="number" id="pointsInput" class="form-control" style="max-width: 70px;" value="5">
            <button class="btn btn-primary rounded-end-pill px-3" onclick="addTask()"><i class="bi bi-plus-lg"></i></button>
        </div>
        <button class="btn btn-sm btn-light w-100 rounded-pill text-primary" onclick="addWeeklyChores()">
            <i class="bi bi-magic"></i> טען משימות שבועיות (ללא שיוך)
        </button>
    </div>
</div>

<script>
    const REPO = "yonathanohayon-oss/house-keeping-v2";
    const FILE_PATH = "tasks.json";
    let sha = "";
    let allTasks = [];

    const WEEKLY_CHORES = [
        { title: "שטיפת רצפה", points: 10 },
        { title: "ניקוי פילטרים מזגן", points: 8 },
        { title: "החלפת מצעים", points: 8 },
        { title: "סידור חדר ילדים", points: 7 },
        { title: "הורדת זבל", points: 3 },
        { title: "הפעלת מדיח", points: 5 },
        { title: "טיפול בגינה", points: 5 }
    ];

    async function fetchTasks() {
        const token = localStorage.getItem('gh_token') || prompt("טוקן גיטהאב:");
        if (!token) return;
        localStorage.setItem('gh_token', token);
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                headers: { 'Authorization': `token ${token}`, 'Cache-Control': 'no-cache' }
            });
            const data = await res.json();
            sha = data.sha;
            allTasks = JSON.parse(new TextDecoder('utf-8').decode(new Uint8Array(atob(data.content).split("").map(c => c.charCodeAt(0)))));
            renderTasks();
            calculateScores();
        } catch (e) { console.error(e); }
    }

    function calculateScores() {
        const scores = { 'יוני': 0, 'אינה': 0 };
        allTasks.forEach(t => { if(t.done && t.user) scores[t.user] += parseInt(t.points || 0); });
        document.getElementById('scoreYoni').innerText = scores['יוני'];
        document.getElementById('scoreIna').innerText = scores['אינה'];
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = allTasks.length ? '' : '<p class="text-center text-muted py-4">הרשימה ריקה!</p>';
        allTasks.forEach((task, index) => {
            const isDone = task.done;
            const badgeClass = !task.user ? 'badge-none' : (task.user === 'יוני' ? 'badge-yoni' : 'badge-ina');
            const userInitial = task.user ? task.user[0] : '?';
            
            list.innerHTML += `
                <div class="task-card ${isDone ? 'done' : ''}">
                    <div class="user-assigned ${badgeClass}">${userInitial}</div>
                    <div class="task-info" onclick="claimTask(${index})">
                        <span style="${isDone ? 'text-decoration:line-through' : ''}">${task.title}</span>
                        <span class="task-points">${task.points} נק'</span>
                    </div>
                    <button class="btn btn-link text-danger p-0" onclick="deleteTask(${index})"><i class="bi bi-trash"></i></button>
                </div>`;
        });
    }

    function claimTask(index) {
        if (allTasks[index].done) {
            allTasks[index].done = false;
            allTasks[index].user = null;
        } else {
            const user = prompt("מי ביצע? (יוני / אינה)");
            if (user === "יוני" || user === "אינה") {
                allTasks[index].done = true;
                allTasks[index].user = user;
            }
        }
        updateGithub();
    }

    function addWeeklyChores() {
        WEEKLY_CHORES.forEach(c => allTasks.push({ ...c, done: false, user: null }));
        updateGithub();
    }

    async function addTask() {
        const title = document.getElementById('taskInput').value;
        const points = document.getElementById('pointsInput').value;
        if (!title) return;
        allTasks.push({ title, points, done: false, user: null });
        updateGithub();
    }

    function deleteTask(index) {
        if(confirm('למחוק?')) { allTasks.splice(index, 1); updateGithub(); }
    }

    async function updateGithub() {
        const token = localStorage.getItem('gh_token');
        document.getElementById('status').innerText = "מעדכן...";
        const bytes = new TextEncoder().encode(JSON.stringify(allTasks, null, 2));
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}` },
            body: JSON.stringify({ message: "Task Update", content: btoa(String.fromCharCode(...bytes)), sha: sha })
        });
        if (res.ok) {
            const data = await res.json(); sha = data.content.sha;
            document.getElementById('status').innerText = "עודכן ✅";
            document.getElementById('taskInput').value = '';
            renderTasks(); calculateScores();
        }
    }
    fetchTasks();
</script>
</body>
</html>
