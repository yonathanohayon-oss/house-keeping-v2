<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליגת המטלות - יוני ואינה</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #6366f1;
            --ina: #ec4899;
            --yoni: #0ea5e9;
            --bg: #f8fafc;
            --card-bg: #ffffff;
        }

        body { 
            background-color: var(--bg); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding-bottom: 180px;
            color: #1e293b;
        }

        .app-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px 20px;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
            text-align: center;
            margin-bottom: 25px;
        }

        .score-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .score-value { font-size: 1.8rem; font-weight: 800; display: block; }
        .score-label { font-size: 0.85rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }

        .section-title {
            font-weight: 700;
            margin: 20px 10px 15px;
            color: #475569;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        .section-title i { margin-left: 8px; color: var(--primary); }

        .task-card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            border: 1px solid #f1f5f9;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .task-card:active { transform: scale(0.97); }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            margin-left: 15px;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .avatar-yoni { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
        .avatar-ina { background: linear-gradient(135deg, #ec4899, #d946ef); }
        .avatar-none { background: #f1f5f9; color: #94a3b8; border: 2px dashed #cbd5e1; }

        .task-content { flex-grow: 1; min-width: 0; }
        .task-name { display: block; font-weight: 600; font-size: 1.05rem; margin-bottom: 2px; }
        .task-meta { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
        .points-tag { background: #eef2ff; color: var(--primary); padding: 2px 10px; border-radius: 20px; font-weight: 700; }

        .task-card.completed { background: #f8fafc; opacity: 0.7; border-color: transparent; }
        .task-card.completed .task-name { text-decoration: line-through; color: #64748b; }

        .floating-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -15px 30px rgba(0,0,0,0.08);
            z-index: 1000;
        }

        .btn-add {
            background: var(--primary);
            border: none;
            width: 50px;
            border-radius: 15px;
            color: white;
            font-size: 1.5rem;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-left: 5px; }
    </style>
</head>
<body>

<div class="app-header">
    <div class="d-flex justify-content-between align-items-center px-2">
        <span class="small fw-bold opacity-75">12 מאי, 2026</span>
        <span id="statusText" class="small fw-bold"><span class="status-dot"></span> מחובר</span>
    </div>
    <h3 class="mt-3 fw-800">ליגת המטלות 🏆</h3>
    <div class="score-container">
        <div class="score-box">
            <span class="score-label">יוני</span>
            <span class="score-value" id="scoreYoni">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">אינה</span>
            <span class="score-value" id="scoreIna">0</span>
        </div>
    </div>
</div>

<div class="container" style="max-width: 500px;">
    <div class="section-title"><i class="bi bi-list-task"></i> משימות פתוחות</div>
    <div id="pendingTasks"></div>

    <div class="section-title mt-4 text-muted"><i class="bi bi-check2-all"></i> בוצעו לאחרונה</div>
    <div id="completedTasks"></div>
</div>

<div class="floating-panel">
    <div id="tokenArea" style="display: none;" class="mb-2">
        <input type="password" id="ghToken" class="form-control form-control-sm rounded-pill" placeholder="הכנס טוקן לחיבור">
    </div>
    <div class="input-group mb-3">
        <input type="text" id="taskInput" class="form-control border-0 bg-light rounded-start-pill px-4" placeholder="מה צריך לעשות?">
        <input type="number" id="pointsInput" class="form-control border-0 bg-light" style="max-width: 60px;" value="5">
        <button class="btn btn-add" onclick="addTask()"><i class="bi bi-plus-circle-fill"></i></button>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-light w-100 rounded-pill fw-bold text-primary btn-sm py-2" onclick="addWeeklyChores()">
            <i class="bi bi-magic me-1"></i> טען משימות שבועיות
        </button>
    </div>
</div>

<script>
    const REPO = "yonathanohayon-oss/house-keeping-v2";
    const FILE_PATH = "tasks.json";
    let sha = ""; let allTasks = [];

    async function fetchTasks() {
        const token = localStorage.getItem('gh_token') || document.getElementById('ghToken').value;
        if (!token) { document.getElementById('tokenArea').style.display = 'block'; return; }
        
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?t=${Date.now()}`, {
                headers: { 'Authorization': `token ${token.trim()}` }
            });
            if (!res.ok) throw new Error();
            const data = await res.json();
            sha = data.sha;
            allTasks = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            localStorage.setItem('gh_token', token.trim());
            document.getElementById('tokenArea').style.display = 'none';
            renderUI();
        } catch (e) {
            document.getElementById('statusText').innerText = "❌ שגיאת חיבור";
            document.getElementById('tokenArea').style.display = 'block';
        }
    }

    function renderUI() {
        const pendingContainer = document.getElementById('pendingTasks');
        const completedContainer = document.getElementById('completedTasks');
        pendingContainer.innerHTML = ''; completedContainer.innerHTML = '';
        
        let scores = { 'יוני': 0, 'אינה': 0 };

        allTasks.forEach((task, index) => {
            const isDone = task.done;
            if (isDone) scores[task.user] += parseInt(task.points);

            const cardHtml = `
                <div class="task-card ${isDone ? 'completed' : ''}">
                    <div class="user-avatar ${!task.user ? 'avatar-none' : (task.user === 'יוני' ? 'avatar-yoni' : 'avatar-ina')}">
                        ${task.user ? task.user[0] : '<i class="bi bi-question"></i>'}
                    </div>
                    <div class="task-content" onclick="claimTask(${index})">
                        <span class="task-name">${task.title}</span>
                        <div class="task-meta">
                            <span class="points-tag">${task.points} נק'</span>
                            ${isDone ? `<span class="badge bg-success-subtle text-success rounded-pill px-2">בוצע ע"י ${task.user}</span>` : ''}
                        </div>
                    </div>
                    <i class="bi bi-trash3 text-danger opacity-25 ms-3" onclick="deleteTask(${index})"></i>
                </div>`;

            if (isDone) completedContainer.insertAdjacentHTML('beforeend', cardHtml);
            else pendingContainer.insertAdjacentHTML('beforeend', cardHtml);
        });

        document.getElementById('scoreYoni').innerText = scores['יוני'] || 0;
        document.getElementById('scoreIna').innerText = scores['אינה'] || 0;
    }

    function claimTask(index) {
        if (allTasks[index].done) {
            if(confirm('להחזיר למשימות פתוחות?')) { allTasks[index].done = false; allTasks[index].user = null; }
        } else {
            const user = prompt("מי התותח/ית שביצע? יוני / אינה");
            if (user === "יוני" || user === "אינה") { allTasks[index].done = true; allTasks[index].user = user; }
            else return;
        }
        updateGithub();
    }

    async function addTask() {
        const title = document.getElementById('taskInput').value;
        const pts = document.getElementById('pointsInput').value;
        if (!title) return;
        allTasks.unshift({ title, points: pts, done: false, user: null });
        updateGithub();
    }

    function addWeeklyChores() {
        const chores = [
            {title:"שטיפת רצפה יסודית", points:10}, {title:"ניקוי פילטרים מזגן", points:8},
            {title:"החלפת מצעים", points:8}, {title:"סידור חדר מיה", points:7},
            {title:"הורדת זבל ומיחזור", points:3}, {title:"מדיח וכלים", points:5}
        ];
        chores.forEach(c => allTasks.unshift({...c, done:false, user:null}));
        updateGithub();
    }

    async function updateGithub() {
        const token = localStorage.getItem('gh_token');
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(allTasks, null, 2))));
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "Update", content, sha: sha })
        });
        if (res.ok) { document.getElementById('taskInput').value = ''; fetchTasks(); }
    }

    async function deleteTask(index) {
        if(confirm('למחוק?')) { allTasks.splice(index, 1); updateGithub(); }
    }

    fetchTasks();
</script>
</body>
</html>
