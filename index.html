<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליגת המטלות - יוני ואינה</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #6366f1; --ina: #ec4899; --yoni: #0ea5e9; }
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; padding-bottom: 140px; }
        .app-container { max-width: 500px; margin: 20px auto; background: white; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); overflow: hidden; }
        .header { background: linear-gradient(135deg, var(--primary), #4338ca); color: white; padding: 25px; text-align: center; }
        .score-board { display: flex; justify-content: space-around; background: rgba(255,255,255,0.15); margin-top: 15px; padding: 15px; border-radius: 20px; }
        .task-card { background: #fff; border: 1px solid #f1f5f9; border-radius: 20px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; transition: all 0.2s; }
        .task-card.done { background-color: #f1f5f9; opacity: 0.8; border: 1px dashed #cbd5e1; }
        .user-assigned { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-left: 12px; font-size: 0.9rem; flex-shrink: 0; }
        .badge-yoni { background: var(--yoni); box-shadow: 0 4px 8px rgba(14, 165, 233, 0.2); }
        .badge-ina { background: var(--ina); box-shadow: 0 4px 8px rgba(236, 72, 153, 0.2); }
        .badge-none { background: #e2e8f0; color: #94a3b8; }
        .task-info { flex-grow: 1; cursor: pointer; min-width: 0; }
        .task-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
        .task-points { font-size: 0.75rem; color: var(--primary); font-weight: bold; background: #eef2ff; padding: 2px 8px; border-radius: 8px; }
        .input-section { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: white; padding: 20px; border-top: 1px solid #f1f5f9; box-shadow: 0 -10px 25px rgba(0,0,0,0.05); z-index: 1000; }
        .status-msg { font-size: 0.75rem; color: #64748b; margin-top: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h3 class="mb-0">מי לוקח את המשימה? 🏆</h3>
        <div class="score-board">
            <div><small>יוני</small><br><strong id="scoreYoni" style="font-size: 1.5rem;">0</strong></div>
            <div style="border-left: 1px solid rgba(255,255,255,0.3);"></div>
            <div><small>אינה</small><br><strong id="scoreIna" style="font-size: 1.5rem;">0</strong></div>
        </div>
    </div>

    <div class="content p-3">
        <div id="taskList">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
        <div id="status" class="text-center status-msg"></div>
    </div>

    <div class="input-section">
        <div id="tokenInputArea" class="mb-2" style="display:none;">
            <input type="password" id="ghToken" class="form-control form-control-sm rounded-pill" placeholder="הכנס טוקן גיטהאב לשמירה">
        </div>
        <div class="input-group mb-2">
            <input type="text" id="taskInput" class="form-control rounded-start-pill" placeholder="משימה חדשה...">
            <input type="number" id="pointsInput" class="form-control" style="max-width: 70px;" value="5">
            <button class="btn btn-primary rounded-end-pill px-3" onclick="addTask()"><i class="bi bi-plus-lg"></i></button>
        </div>
        <button class="btn btn-sm btn-light w-100 rounded-pill text-primary fw-bold" onclick="addWeeklyChores()">
            <i class="bi bi-magic"></i> טען משימות שבועיות קבועות
        </button>
    </div>
</div>

<script>
    const REPO = "yonathanohayon-oss/house-keeping-v2";
    const FILE_PATH = "tasks.json";
    let sha = "";
    let allTasks = [];

    const WEEKLY_CHORES = [
        { title: "שטיפת רצפה", points: 10 },
        { title: "ניקוי פילטרים מזגן", points: 8 },
        { title: "החלפת מצעים", points: 8 },
        { title: "סידור חדר הילדים (מיה)", points: 7 },
        { title: "הורדת זבל ומיחזור", points: 3 },
        { title: "הפעלת מדיח וריקון", points: 5 },
        { title: "טיפול בגינה ובעציצים", points: 5 }
    ];

    async function fetchTasks() {
        const token = localStorage.getItem('gh_token');
        if (!token) {
            document.getElementById('tokenInputArea').style.display = 'block';
            return;
        }
        
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?t=${new Date().getTime()}`, {
                headers: { 'Authorization': `token ${token}`, 'Cache-Control': 'no-cache' }
            });
            if (!res.ok) throw new Error("Unauthorized");
            
            const data = await res.json();
            sha = data.sha;
            
            const binaryString = atob(data.content);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) { bytes[i] = binaryString.charCodeAt(i); }
            const decodedText = new TextDecoder('utf-8').decode(bytes);
            
            allTasks = JSON.parse(decodedText);
            renderTasks();
            calculateScores();
            document.getElementById('status').innerText = "עודכן הרגע ✅";
        } catch (e) { 
            document.getElementById('tokenInputArea').style.display = 'block';
            document.getElementById('status').innerText = "שגיאת חיבור או טוקן";
        }
    }

    function calculateScores() {
        const scores = { 'יוני': 0, 'אינה': 0 };
        allTasks.forEach(t => { if(t.done && t.user) scores[t.user] += parseInt(t.points || 0); });
        document.getElementById('scoreYoni').innerText = scores['יוני'];
        document.getElementById('scoreIna').innerText = scores['אינה'];
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = allTasks.length ? '' : '<p class="text-center text-muted py-4">אין משימות פתוחות. לחץ למטה לטעינה!</p>';
        allTasks.forEach((task, index) => {
            const isDone = task.done;
            const badgeClass = !task.user ? 'badge-none' : (task.user === 'יוני' ? 'badge-yoni' : 'badge-ina');
            const userInitial = task.user ? task.user[0] : '?';
            
            list.innerHTML += `
                <div class="task-card ${isDone ? 'done' : ''}">
                    <div class="user-assigned ${badgeClass}">${userInitial}</div>
                    <div class="task-info" onclick="claimTask(${index})">
                        <span class="task-title" style="${isDone ? 'text-decoration:line-through' : ''}">${task.title}</span>
                        <span class="task-points">${task.points} נק'</span>
                    </div>
                    <button class="btn btn-link text-danger p-0 ms-2" onclick="deleteTask(${index})"><i class="bi bi-trash"></i></button>
                </div>`;
        });
    }

    function claimTask(index) {
        if (allTasks[index].done) {
            if(confirm('להחזיר את המטלה לרשימה?')) {
                allTasks[index].done = false;
                allTasks[index].user = null;
            }
        } else {
            const user = prompt("מי ביצע? (יוני / אינה)");
            if (user === "יוני" || user === "אינה") {
                allTasks[index].done = true;
                allTasks[index].user = user;
            }
        }
        updateGithub();
    }

    function addWeeklyChores() {
        WEEKLY_CHORES.forEach(c => allTasks.push({ ...c, done: false, user: null }));
        updateGithub();
    }

    async function addTask() {
        const title = document.getElementById('taskInput').value;
        const points = document.getElementById('pointsInput').value;
        const tokenInput = document.getElementById('ghToken').value;
        
        if (tokenInput) localStorage.setItem('gh_token', tokenInput);
        if (!title) return;

        allTasks.push({ title, points, done: false, user: null });
        updateGithub();
    }

    function deleteTask(index) {
        if(confirm('למחוק את המשימה לצמיתות?')) { 
            allTasks.splice(index, 1); 
            updateGithub(); 
        }
    }

    async function updateGithub() {
        const token = localStorage.getItem('gh_token');
        if (!token) { alert("חסר טוקן!"); return; }
        
        document.getElementById('status').innerText = "שומר בענן...";
        
        try {
            const bytes = new TextEncoder().encode(JSON.stringify(allTasks, null, 2));
            const base64Content = btoa(String.fromCharCode(...bytes));

            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Update tasks", content: base64Content, sha: sha })
            });

            if (res.ok) {
                const data = await res.json();
                sha = data.content.sha;
                document.getElementById('status').innerText = "נשמר בהצלחה ✅";
                document.getElementById('taskInput').value = '';
                renderTasks(); 
                calculateScores();
            } else {
                throw new Error("Update failed");
            }
        } catch (e) {
            document.getElementById('status').innerText = "שגיאת שמירה - נסה לרענן";
        }
    }

    fetchTasks();
</script>
</body>
</html>
