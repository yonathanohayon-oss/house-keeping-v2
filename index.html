<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליגת המטלות - יוני ואינה</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #6366f1; --ina: #ec4899; --yoni: #0ea5e9; }
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; padding-bottom: 160px; }
        .app-container { max-width: 500px; margin: 10px auto; background: white; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .header { background: linear-gradient(135deg, var(--primary), #4338ca); color: white; padding: 20px; text-align: center; border-radius: 25px 25px 0 0; }
        .score-board { display: flex; justify-content: space-around; background: rgba(255,255,255,0.15); margin-top: 10px; padding: 10px; border-radius: 15px; }
        .task-card { background: #fff; border: 1px solid #f1f5f9; border-radius: 15px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; }
        .user-badge { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-left: 12px; flex-shrink: 0; }
        .badge-yoni { background: var(--yoni); } .badge-ina { background: var(--ina); } .badge-none { background: #e2e8f0; color: #94a3b8; }
        .input-section { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: white; padding: 15px; border-top: 1px solid #f1f5f9; box-shadow: 0 -10px 20px rgba(0,0,0,0.05); z-index: 9999; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h4 class="mb-0">ליגת המטלות 🏆</h4>
        <div class="score-board">
            <div><small>יוני</small><br><strong id="scoreYoni">0</strong></div>
            <div><small>אינה</small><br><strong id="scoreIna">0</strong></div>
        </div>
    </div>
    <div class="content p-3">
        <div id="taskList"><p class="text-center text-muted">טוען...</p></div>
        <div id="status" class="text-center small text-muted"></div>
    </div>
    <div class="input-section">
        <input type="password" id="ghToken" class="form-control form-control-sm mb-2" placeholder="הדבק טוקן כאן">
        <div class="input-group mb-2">
            <input type="text" id="taskInput" class="form-control" placeholder="מטלה...">
            <button class="btn btn-primary" onclick="addTask()">+</button>
        </div>
        <button class="btn btn-sm btn-outline-primary w-100" onclick="addWeeklyChores()">טען משימות שבועיות</button>
    </div>
</div>

<script>
    const REPO = "yonathanohayon-oss/house-keeping-v2";
    const FILE_PATH = "tasks.json";
    let sha = ""; let allTasks = [];

    async function fetchTasks() {
        const token = document.getElementById('ghToken').value || localStorage.getItem('gh_token');
        if (!token) { document.getElementById('taskList').innerHTML = "נא להזין טוקן למטה"; return; }
        localStorage.setItem('gh_token', token);
        
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?t=${Date.now()}`, {
                headers: { 'Authorization': `token ${token.trim()}` }
            });
            if (!res.ok) throw new Error("מפתח לא תקין");
            const data = await res.json();
            sha = data.sha;
            const content = decodeURIComponent(escape(atob(data.content)));
            allTasks = content ? JSON.parse(content) : [];
            renderTasks(); calculateScores();
            document.getElementById('status').innerText = "מחובר ✅";
        } catch (e) { document.getElementById('status').innerText = "שגיאה: " + e.message; }
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = allTasks.length ? '' : 'אין משימות';
        allTasks.forEach((task, index) => {
            const badgeClass = !task.user ? 'badge-none' : (task.user === 'יוני' ? 'badge-yoni' : 'badge-ina');
            list.innerHTML += `
                <div class="task-card ${task.done ? 'opacity-50' : ''}">
                    <div class="user-badge ${badgeClass}">${task.user ? task.user[0] : '?'}</div>
                    <div class="flex-grow-1" onclick="claimTask(${index})" style="cursor:pointer">
                        <span style="${task.done ? 'text-decoration:line-through' : ''}">${task.title}</span>
                        <small class="d-block text-primary">${task.points} נק'</small>
                    </div>
                    <i class="bi bi-trash text-danger ms-2" onclick="deleteTask(${index})"></i>
                </div>`;
        });
    }

    async function claimTask(index) {
        if (allTasks[index].done) { allTasks[index].done = false; allTasks[index].user = null; }
        else {
            const user = prompt("מי ביצע? יוני / אינה");
            if (user === "יוני" || user === "אינה") { allTasks[index].done = true; allTasks[index].user = user; }
            else return;
        }
        updateGithub();
    }

    async function addTask() {
        const t = document.getElementById('taskInput').value;
        if (!t) return;
        allTasks.push({ title: t, points: 5, done: false, user: null });
        updateGithub();
    }

    async function addWeeklyChores() {
        const weekly = [{title:"שטיפת רצפה", points:10}, {title:"מזגן", points:8}, {title:"מצעים", points:8}, {title:"מיה", points:7}, {title:"זבל", points:3}, {title:"מדיח", points:5}];
        weekly.forEach(c => allTasks.push({...c, done:false, user:null}));
        updateGithub();
    }

    async function deleteTask(index) { if(confirm('למחוק?')) { allTasks.splice(index, 1); updateGithub(); } }

    async function updateGithub() {
        const token = localStorage.getItem('gh_token');
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(allTasks, null, 2))));
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "Update", content, sha: sha })
        });
        if (res.ok) fetchTasks();
    }

    fetchTasks();
</script>
</body>
</html>
